<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🔱Trueno</title>
<link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css">
</head>
<body>
<div id="swagger-ui"></div>
<script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
<script>
function fmtBytes(n) {
  if (n >= 1024 * 1024) return (n / (1024 * 1024)).toFixed(0) + " MiB";
  if (n >= 1024) return (n / 1024).toFixed(0) + " KiB";
  return n + " B";
}
function fmtDuration(sec) {
  if (sec >= 3600) return (sec / 3600).toFixed(0) + "h";
  if (sec >= 60) return (sec / 60).toFixed(0) + "min";
  return sec + "s";
}
function limitsMarkdown(info) {
  const ttls = Object.entries(info.ttl_choices).map(([b, ttl]) => {
    const label = ttl === null ? "no expiry" : fmtDuration(ttl);
    const isDefault = b === info.default_time ? ", default" : "";
    return "`" + b + "` (" + label + isDefault + ")";
  }).join(" / ");
  const idLens = Object.entries(info.id_len_by_bucket).map(([b, n]) => "`" + b + "`=" + n).join(" / ");
  // Two leading newlines guarantee a blank line between the existing
  // description and this block. Without it, any setext-like underline
  // (`---` / `===`) on the next line would promote the preceding paragraph
  // to <h2>/<h1>; an explicit blank line keeps the description a <p>.
  // No <hr> here either — the bold section labels are enough.
  return "\n\n" + [
    "**Endpoints**",
    "",
    "- Server: `" + info.public_url + "`",
    "- Web UI: `" + info.web_ui_url + "`",
    "",
    "**Limits**",
    "",
    "- Max upload: " + fmtBytes(info.max_bytes),
    "- TTL choices: " + ttls,
    "- Rate limit: " + info.rate_max_items + " uploads / " + fmtDuration(info.rate_window_sec) + " (host-wide)",
    "- ID length: " + idLens + " chars (base62)",
    "- Allowed extensions: " + info.allowed_exts.map(e => "`" + e + "`").join(" "),
  ].join("\n");
}
Promise.all([
  fetch("/openapi.json").then(r => r.json()),
  fetch("/info").then(r => r.ok ? r.json() : null).catch(() => null)
]).then(([spec, info]) => {
  if (info) {
    spec.info.description = (spec.info.description || "") + limitsMarkdown(info);
  }
  SwaggerUIBundle({
    spec,
    dom_id: "#swagger-ui",
    deepLinking: false,
    docExpansion: "list",
    defaultModelsExpandDepth: -1,
    tryItOutEnabled: false,
    supportedSubmitMethods: []
  });
});
</script>
</body>
</html>
